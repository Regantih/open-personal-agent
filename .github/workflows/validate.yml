name: validate-specs
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema pyyaml
      - run: python tools/validate.py
      - run: python -c "import yaml; yaml.safe_load(open('spec/risk-policy/policy.example.yaml'))"
