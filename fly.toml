# fly deploy from the REPO ROOT — app/Dockerfile's build context expects the
# repo root (it copies spec/ for the risk policy). SQLite persists on the
# opa_data volume below; create it once with:
#   fly volumes create opa_data --size 1 --region dfw
# Or set DATABASE_URL (Neon/Supabase/fly postgres) and drop the mounts block.
app = "open-personal-agent"
primary_region = "dfw"

[build]
  dockerfile = "app/Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  OPA_DB_PATH = "/data/opa.db"
  OPA_CHROME_PATH = "/usr/bin/chromium"
  OPA_SIMULATED_CALL_REALTIME = "1"
  OPA_PLANNER_MODEL = "claude-sonnet-4-5-20250929"
  OPA_FAST_MODEL = "claude-haiku-4-5-20251001"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "opa_data"
  destination = "/data"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
