# fly deploy from the repo root or app/. Pair with a Neon/Supabase DATABASE_URL
# or fly postgres (fly pg create + fly pg attach → sets DATABASE_URL).
app = "open-personal-agent"
primary_region = "dfw"

[build]
  dockerfile = "app/Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# SQLite persistence alternative (skip if DATABASE_URL is set):
#   fly volumes create opa_data --size 1
# [mounts]
#   source = "opa_data"
#   destination = "/data"
# and set OPA_DB_PATH=/data/opa.db
